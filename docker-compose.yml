services:
  accounts-db:
    image: postgres:16
    container_name: cloudbank-accounts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudbank
      POSTGRES_PASSWORD: cloudbank_dev_pw
      POSTGRES_DB: accounts_db
    ports:
      - "5432:5432"
    volumes:
      - accounts_db_data:/var/lib/postgresql/data

  transactions-db:
    image: postgres:16
    container_name: cloudbank-transactions-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudbank
      POSTGRES_PASSWORD: cloudbank_dev_pw
      POSTGRES_DB: transactions_db
    ports:
      - "5433:5432"
    volumes:
      - transactions_db_data:/var/lib/postgresql/data

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: cloudbank-servicebus-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CloudBank_SB_Pw1!"
    ports:
      - "1433:1433"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: cloudbank-servicebus
    restart: unless-stopped
    depends_on:
      - sqledge
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "CloudBank_SB_Pw1!"
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./servicebus-emulator/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json

volumes:
  accounts_db_data:
  transactions_db_data:
